<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScenarioView</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="nav-controls">
        <button id="backBtn" class="nav-btn" title="Back (Alt+Left)">◀</button>
        <button id="forwardBtn" class="nav-btn" title="Forward (Alt+Right)">▶</button>
        <button id="reloadBtn" class="nav-btn" title="Reload (Ctrl+R)">↻</button>
        <button id="homeBtn" class="nav-btn" title="Home">🏠</button>
      </div>

      <!-- Address Bar -->
      <div class="address-bar-container">
        <input
          type="text"
          id="addressBar"
          class="address-bar"
          placeholder="Enter URL or search..."
        />
        <div id="loadingIndicator" class="loading-indicator hidden"></div>
      </div>

      <!-- Tab Controls -->
      <div class="tab-controls">
        <button id="newTabBtn" class="tab-btn" title="New Tab (Ctrl+T)">+</button>
      </div>
    </div>

    <!-- Bookmark Bar -->
    <div class="bookmark-bar" id="bookmarkBar"></div>

    <!-- Tab Bar -->
    <div class="tab-bar" id="tabBar"></div>

    <!-- Web Views Container -->
    <div class="webview-container" id="webviewContainer"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
